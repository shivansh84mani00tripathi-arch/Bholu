<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday Bholu ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;text-align:center;background:linear-gradient(135deg,#17143d,#30245d,#17143d)}
main{max-width:900px;margin:auto;padding:40px 16px 60px}h1{font-size:clamp(38px,9vw,70px);margin:10px 0 15px;background:linear-gradient(90deg,#ff7bd5,#00e5ff,#ff7bd5);-webkit-background-clip:text;color:transparent}
.subtitle{font-size:22px;line-height:1.4}.photos{display:flex;gap:15px;justify-content:center;margin:35px 0 50px}.photos img{width:30%;max-width:260px;height:350px;object-fit:cover;border:5px solid white;border-radius:25px;box-shadow:0 10px 30px #0008}.photos img:first-child{transform:rotate(-5deg)}.photos img:last-child{transform:rotate(5deg)}
.card{max-width:650px;margin:auto;padding:28px 18px;border-radius:28px;background:#ffffff18;border:1px solid #ffffff35;backdrop-filter:blur(8px)}.card p{font-size:22px}
button{border:0;border-radius:50px;padding:18px 28px;font-size:20px;font-weight:bold;color:white;background:linear-gradient(90deg,#ff168f,#b626ff);cursor:pointer;box-shadow:0 0 25px #ff168f88}
#status{margin-top:18px;font-size:17px}
audio{display:none}
@media(max-width:600px){.photos{gap:8px}.photos img{height:300px;border-width:4px}.card{padding:25px 12px}}
</style>
</head>
<body>
<main>
<h1>Happy Birthday Bholu! 🎉</h1>
<p class="subtitle">Wishing you a year filled with endless laughter,<br>success, and pure joy! ❤️</p>
<div class="photos">
<img src="28780.jpg" alt="Birthday memory">
<img src="28779.jpg" alt="Birthday memory">
<img src="28778.jpg" alt="Birthday memory">
</div>
<div class="card">
<p>💌 I have something special to say...</p>
<button id="playBtn">🎙️ Play My Voice ❤️</button>
<div id="status">💖 Hope you liked my message!</div>
</div>
</main>

<audio id="bgMusic" loop preload="auto"><source src="music.mp3" type="audio/mpeg"></audio>
<audio id="voiceMessage" preload="auto"><source src="voice.mp3" type="audio/mpeg"></audio>

<script>
const music=document.getElementById("bgMusic");
const voice=document.getElementById("voiceMessage");
const button=document.getElementById("playBtn");
const status=document.getElementById("status");

button.addEventListener("click",async()=>{
  try{
    music.currentTime=0;
    await music.play();
    voice.currentTime=0;
    await voice.play();
    button.textContent="🎵 Playing for Bholu ❤️";
    status.textContent="💖 Enjoy your birthday message!";
  }catch(e){
    status.textContent="Tap the button once more to start the music and voice.";
  }
});
voice.addEventListener("ended",()=>{
  button.textContent="🎙️ Play My Voice ❤️";
  status.textContent="💖 Hope you liked my message!";
});
</script>
</body>
</html>
